services:
  bwl:
    build:
      context: .
    image: bloom-web-link:local
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "127.0.0.1:9377:9377"
      - "127.0.0.1:6080:6080"
    environment:
      BWL_ACCESS_KEY: ${BWL_ACCESS_KEY:-}
      BWL_API_KEY: ${BWL_API_KEY:-}
      BWL_ADMIN_KEY: ${BWL_ADMIN_KEY:-}
      BWL_CRASH_REPORT_ENABLED: ${BWL_CRASH_REPORT_ENABLED:-false}
    volumes:
      - bwl-data:/root/.bwl
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9377/gateway/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  bwl-data:
