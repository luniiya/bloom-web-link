services:
  camofox:
    build:
      context: .
    image: camofox-browser:local
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "9377:9377"
      - "6080:6080"
    environment:
      CAMOFOX_ACCESS_KEY: ${CAMOFOX_ACCESS_KEY:-}
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY:-}
      CAMOFOX_ADMIN_KEY: ${CAMOFOX_ADMIN_KEY:-}
      CAMOFOX_CRASH_REPORT_ENABLED: ${CAMOFOX_CRASH_REPORT_ENABLED:-false}
    volumes:
      - camofox-data:/root/.camofox
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9377/gateway/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  camofox-data:
